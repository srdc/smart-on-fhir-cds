  kroniq-valuesets-path = "/smart-cds/valueset/"
  concept-definitions-path = "/smart-cds/definitions/concepts"
 }

# Configurations related with Akka.io platform (Do not change this unless you are a experienced user)
akka {
  stdout-loglevel = "OFF"
  loglevel = "OFF"
  #loggers = [akka.event.slf4j.Slf4jLogger]
  #loglevel = debug
  actor {
    #debug {
    #  receive = off
    #  lifecycle = off
    #}
    deployment {
      "/**" {
        dispatcher = "akka.actor.onfhir-blocking-dispatcher"
      }
    }
    onfhir-blocking-dispatcher {
      type = Dispatcher
      executor = "thread-pool-executor"
      thread-pool-executor {
        fixed-pool-size = 32
      }
      throughput = 1
    }
  }
}