onfhir.cds {
  # Root definitions folder for CDS-Hooks Service and Hook definitions (If not given the project resources folder is searched for definitions)
  definitions-path = "/smart-cds/definitions"

  server {
      # Hostname that onFhir Cds-Hooks server will work. Using 0.0.0.0 will bind the server to both localhost and the IP of the server that you deploy it
      host = 0.0.0.0
      # Port that onFhir Cds-Hooks server will listen
      port = 8080
      # Base Uri for Cds-Hooks server
      base-uri = "cds-hooks"
    }

